site_name: HackRF + PortaPack Mayhem — українська документація
site_description: Неофіційний український переклад документації HackRF та PortaPack Mayhem
site_url: https://REPLACE_USER.github.io/REPLACE_REPO/
repo_url: https://github.com/REPLACE_USER/REPLACE_REPO
docs_dir: docs
use_directory_urls: true
theme:
  name: material
  language: uk
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Темна тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Світла тема}
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
validation:
  absolute_links: ignore
  unrecognized_links: ignore
  anchors: ignore
