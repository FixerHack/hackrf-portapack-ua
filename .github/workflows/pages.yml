name: Deploy docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs<2" mkdocs-material
      - name: Build sources and nav
        run: |
          python scripts/build_docs.py
          python scripts/gen_mkdocs.py
          REPO="${GITHUB_REPOSITORY#*/}"; OWNER="${GITHUB_REPOSITORY_OWNER}"
          sed -i "s#REPLACE_USER#${OWNER}#g; s#REPLACE_REPO#${REPO}#g" mkdocs.yml
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
